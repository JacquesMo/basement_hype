<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Ultimate Scoreboard - District Hype</title>
    <style>
        html, body {
            cursor: none !important;
        }
        :root {
            --bg-color: #2f2f2f;
            --card-bg: rgba(18, 18, 18, 0.95);
            --accent: #007bff;
            --text-dim: #888;
            --live-red: #ff3b30;
            --success: #34c759;
            --warning: #ffcc00;
            --yankees-blue: #006dda;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents scrollbars completely */
        }

        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('YankeesPro Sports Background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Balances the layout vertically */
        }

        #scoreboard-title {
            font-size: 2.2rem;
            font-weight: 900;
            margin: 5px 0 10px 0;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Layout Container - 3 Column Setup */
        .app-layout {
            display: flex;
            flex-direction: row;
            gap: 15px;
            width: 100%;
            max-width: 1800px;
            flex-grow: 1; /* Take up available space */
            align-items: center; 
            justify-content: center;
        }

        /* Sidebar Style - Consistent 220px width */
        .tracker-sidebar {
            width: 220px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .main-container {
            flex-grow: 1;
            max-width: 1250px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid #333;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .game-card { 
            padding: 20px 25px; 
        }

        /* Sidebar/Tracker Card Styles */
        .sidebar-card {
            padding: 15px;
            text-align: center;
            border-top: 4px solid var(--yankees-blue);
        }
        
        .sidebar-card.standings-card {
            border-top: 4px solid var(--success);
        }

        .player-name-header {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #fff;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            text-transform: uppercase;
        }

        .detail-label { color: var(--text-dim); }

        /* Standings Styles */
        .standings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .standings-table th {
            text-align: left;
            color: var(--text-dim);
            padding-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.75rem;
        }
        .standings-table td {
            padding: 6px 0;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .team-row-name { display: flex; align-items: center; gap: 8px; }
        .standings-logo { width: 20px; height: 20px; filter: drop-shadow(1px 1px 0px rgba(255,255,255,0.2)); }
        .is-my-team { color: var(--success); } 

        /* Jazz Stats Grid */
        .stat-grid {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            margin-bottom: 5px;
        }

        .stat-box {
            background: rgba(255,255,255,0.03);
            padding: 10px 5px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-big-number {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--yankees-blue);
            line-height: 1;
            margin-bottom: 5px;
            text-shadow: 0 0 1px rgba(255, 255, 255, 0.416);
        }

        .stat-label {
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .live-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--live-red);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1.1rem;
        }

        .pulse {
            width: 12px;
            height: 12px;
            background: var(--live-red);
            border-radius: 50%;
            animation: pulse-animation 1.5s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(255, 59, 48, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        /* Matchup Header and Situation Bar Grid Alignment */
        .matchup-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            margin-bottom: 10px;
            width: 100%;
        }

        .team-box { display: flex; flex-direction: column; align-items: center; }
        
        .team-logo { 
            width: 90px; 
            height: 90px; 
            margin-bottom: 5px; 
            filter: drop-shadow(1px 1px 0px #fff) 
                    drop-shadow(-1px -1px 0px #fff) 
                    drop-shadow(1px -1px 0px #fff) 
                    drop-shadow(-1px 1px 0px #fff);
        }

        .team-name { font-size: 2.2rem; color: var(--text-dim); font-weight: bold; }
        .score-large { font-size: 5.5rem; font-weight: 600; line-height: 1; margin-top: 5px; }

        .game-info-center { text-align: center; }
        .period-text { font-size: 1.8rem; font-weight: bold; color: var(--warning); display: block; }
        
        .outs-dots { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin-top: -10px; 
        }
        .dot { width: 20px; height: 20px; border-radius: 50%; background: #333; border: 1px solid #444; }
        .dot.active { background: var(--warning); border-color: var(--warning); box-shadow: 0 0 2px var(--warning); }

        .live-count-display {
            font-size: 1.6rem;
            font-weight: 900;
            color: #fff;
            margin-top: 8px;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.05);
            padding: 4px 15px;
            border-radius: 6px;
            display: inline-block;
        }

        .diamond-container {
            width: 65px;
            height: 65px;
            margin: 20px auto 10px auto; 
            position: relative;
            transform: rotate(45deg);
        }
        .base {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #333;
            border: 0px solid #555;
        }
        .base.occupied { background: var(--warning); border-color: #787878; box-shadow: 0 0 2px var(--warning); }
        .b-1 { top: 0; right: 0; }
        .b-2 { top: 0; left: 0; }
        .b-3 { bottom: 0; left: 0; }

        /* Unified styling to perfectly align columns with matchup-header above */
        .situation-bar {
            background: rgba(30, 30, 30, 0.6);
            padding: 15px 0; /* Zero L/R padding ensures exact column width matching */
            border-radius: 16px;
            margin-top: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px 0; /* Zero L/R gap ensures exact column width matching */
            width: 100%;
            text-align: center;
        }

        .situ-label { color: var(--text-dim); display: block; margin-bottom: 4px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; }
        .situ-value { font-size: 1.3rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .table-container { margin-top: 15px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { 
            color: var(--text-dim); 
            font-size: 1.6rem; 
            padding: 10px; 
            border-bottom: 3px solid #333;
            text-align: center; 
        }
        td { 
            padding: 12px 10px; 
            font-size: 1.5rem; 
            font-weight: bold; 
            border-bottom: 1px solid #2a2a2a;
            text-align: center; 
        }
        .total-col { background: rgba(255,255,255,0.05); color: var(--warning); font-size: 1.8rem; }

        /* Ticker now spans wide at the bottom */
        .ticker-wrap {
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1.6rem;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            border: 1px solid #333;
            margin-top: 10px;
            margin-bottom: 5px;
            backdrop-filter: blur(5px);
            width: 100%;
            max-width: 1800px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .ticker-move {
            display: inline-block;
            animation: ticker 60s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .ticker-item { margin-right: 60px; font-weight: bold; }
        .ticker-score { color: var(--warning); }

        .refresh-tag { margin-top: 0; margin-bottom: 5px; font-size: 0.8rem; color: #aaa; font-weight: bold; text-shadow: 0 1px 2px #000; flex-shrink: 0;}

        @media (max-width: 1300px) {
            body { overflow-y: auto; height: auto; } /* Allow scroll on smaller screens */
            .app-layout { flex-direction: column; align-items: center; }
            .tracker-sidebar { width: 100%; max-width: 600px; flex-direction: row; }
            .sidebar-card { flex: 1; }
        }
    </style>
</head>
<body>

    <h1 id="scoreboard-title">Shoot for the Stars...   Land on the Moon</h1>
    
    <div class="app-layout">
        <!-- LEFT: Jazz Tracker -->
        <div class="tracker-sidebar">
            <div class="card sidebar-card">
                <div class="player-name-header">JAZZ 50/50 Tracker</div>
                
                <div class="stat-grid">
                    <div class="stat-box">
                        <div class="stat-big-number" id="jazz-hr-count">--</div>
                        <div class="stat-label">HR</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-big-number" id="jazz-sb-count">--</div>
                        <div class="stat-label">SB</div>
                    </div>
                </div>
                
                <div style="margin-top: 10px; color: var(--text-dim); font-size: 0.65rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">2026 Season Stats</div>
            </div>
        </div>

        <!-- CENTER: Main Content -->
        <div class="main-container">
            <div id="hero-game" class="card game-card">
                <div style="padding: 60px; font-size: 1.5rem; text-align:center;">Connecting to MLB data feed...</div>
            </div>
        </div>

        <!-- RIGHT: Dynamic Standings -->
        <div class="tracker-sidebar">
            <!-- Standings Card -->
            <div class="card sidebar-card standings-card">
                <div class="player-name-header" id="standings-header">STANDINGS</div>
                <table class="standings-table">
                    <thead>
                        <tr>
                            <th>Team</th>
                            <th style="text-align:center">W-L</th>
                            <th style="text-align:right">GB</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body">
                        <tr><td colspan="3" style="text-align:center; color: #555; padding: 20px;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Ticker placed outside layout to span bottom and center -->
    <div class="ticker-wrap">
        <div id="league-ticker" class="ticker-move">
            Loading league scores...
        </div>
    </div>
    
    <div class="refresh-tag" id="refresh-time" style="text-align: center;"></div>

    <script>
        const MY_TEAM = 'NYY'; 
        const JAZZ_ID = '665862'; // MLB Stats API ID for Jazz Chisholm Jr.
        const API_URL = "https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard";
        const PLAYER_API = `https://statsapi.mlb.com/api/v1/people/${JAZZ_ID}/stats?stats=season&group=hitting&season=2026`;
        const STANDINGS_URL = "https://statsapi.mlb.com/api/v1/standings?leagueId=103,104"; // Both AL and NL

        // Map MLB Stats API Team IDs to Abbreviations
        const MLB_TEAMS = {
            110: 'BAL', 111: 'BOS', 147: 'NYY', 139: 'TB', 141: 'TOR', // AL East
            145: 'CWS', 114: 'CLE', 116: 'DET', 118: 'KC', 142: 'MIN', // AL Central
            117: 'HOU', 108: 'LAA', 133: 'OAK', 136: 'SEA', 140: 'TEX', // AL West
            144: 'ATL', 146: 'MIA', 121: 'NYM', 143: 'PHI', 120: 'WSH', // NL East
            112: 'CHC', 113: 'CIN', 158: 'MIL', 134: 'PIT', 138: 'STL', // NL Central
            109: 'ARI', 115: 'COL', 119: 'LAD', 135: 'SD', 137: 'SF'    // NL West
        };

        const DIVISIONS = {
            201: 'AL EAST', 202: 'AL CENTRAL', 203: 'AL WEST',
            204: 'NL EAST', 205: 'NL CENTRAL', 206: 'NL WEST'
        };

        async function updateDashboard() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                const mainGame = data.events.find(e => 
                    e.competitions[0].competitors.some(c => c.team.abbreviation === MY_TEAM)
                );

                renderHero(mainGame);
                renderTicker(data.events);
                
                updateJazzTracker();
                updateStandings();

                document.getElementById('refresh-time').innerText = `Last Update: ${new Date().toLocaleTimeString()}`;
            } catch (e) {
                console.error("Dashboard error:", e);
            }
        }

        async function updateJazzTracker() {
            try {
                const response = await fetch(PLAYER_API);
                const data = await response.json();
                
                const stats = data.stats?.[0]?.splits?.[0]?.stat;
                if (stats) {
                    document.getElementById('jazz-hr-count').innerText = stats.homeRuns !== undefined ? stats.homeRuns : "0";
                    document.getElementById('jazz-sb-count').innerText = stats.stolenBases !== undefined ? stats.stolenBases : "0";
                }
            } catch (e) {
                console.error("Jazz tracker error:", e);
            }
        }

        async function updateStandings() {
            try {
                const response = await fetch(STANDINGS_URL);
                const data = await response.json();
                
                if (!data || !data.records) throw new Error("Invalid structure");

                // Find which division MY_TEAM belongs to
                let myDivision = null;
                for (const record of data.records) {
                    if (record.teamRecords.some(tr => MLB_TEAMS[tr.team.id] === MY_TEAM)) {
                        myDivision = record;
                        break;
                    }
                }

                if (!myDivision || !myDivision.teamRecords) throw new Error("Division not found for " + MY_TEAM);
                
                // Update the Header Dynamically
                const divHeader = DIVISIONS[myDivision.division.id] || "STANDINGS";
                document.getElementById('standings-header').innerText = divHeader;

                const standings = myDivision.teamRecords.map(entry => {
                    return {
                        name: MLB_TEAMS[entry.team.id] || entry.team.name,
                        wins: entry.wins, 
                        losses: entry.losses, 
                        gb: entry.divisionGamesBack === '-' ? '-' : entry.divisionGamesBack,
                        logo: `https://www.mlbstatic.com/team-logos/${entry.team.id}.svg`
                    };
                });

                let html = '';
                standings.forEach(t => {
                    const highlight = t.name === MY_TEAM ? 'is-my-team' : '';
                    html += `
                        <tr class="${highlight}">
                            <td>
                                <div class="team-row-name">
                                    <img src="${t.logo}" class="standings-logo" onerror="this.style.display='none'">
                                    ${t.name}
                                </div>
                            </td>
                            <td style="text-align:center">${t.wins}-${t.losses}</td>
                            <td style="text-align:right">${t.gb}</td>
                        </tr>
                    `;
                });
                document.getElementById('standings-body').innerHTML = html;
            } catch (e) { 
                console.error("Standings error:", e); 
                document.getElementById('standings-body').innerHTML = `<tr><td colspan="3" style="text-align:center; color: #777; padding: 15px;">Standings Unavailable</td></tr>`;
            }
        }

        function renderHero(event) {
            const container = document.getElementById('hero-game');
            if (!event) {
                container.innerHTML = `<div style="text-align:center; padding:80px;">
                    <h2 style="font-size: 4rem; margin:0">No ${MY_TEAM} Game Today</h2>
                    <p style="color:#eee; font-size: 2rem; margin-top:20px; text-shadow: 0 2px 4px #000;">The Mets still suck.</p>
                </div>`;
                return;
            }

            const comp = event.competitions[0];
            const status = comp.status;
            const state = status.type.state; 
            const away = comp.competitors.find(c => c.homeAway === 'away');
            const home = comp.competitors.find(c => c.homeAway === 'home');

            let html = '';
            if (state === 'in') {
                html += `<div class="live-indicator"><div class="pulse"></div>LIVE</div>`;
            }

            html += `
                <div class="matchup-header">
                    <div class="team-box">
                        <img class="team-logo" src="${away.team.logo}" alt="away">
                        <span class="team-name">${away.team.abbreviation}</span>
                        <div class="score-large">${state === 'pre' ? '' : away.score}</div>
                    </div>
                    <div class="game-info-center">
                        <span class="period-text">${status.type.shortDetail}</span>
                        ${state === 'in' ? renderDiamond(comp.situation) : ''}
                        ${state === 'in' ? renderOuts(comp.situation?.outs) : ''}
                        ${state === 'in' ? `<div class="live-count-display">${comp.situation?.balls || 0}-${comp.situation?.strikes || 0}</div>` : ''}
                    </div>
                    <div class="team-box">
                        <img class="team-logo" src="${home.team.logo}" alt="home">
                        <span class="team-name">${home.team.abbreviation}</span>
                        <div class="score-large">${state === 'pre' ? '' : home.score}</div>
                    </div>
                </div>
            `;

            // Extract common game details
            const awayStarter = away.probables?.[0];
            const homeStarter = home.probables?.[0];
            const getStarterDisplay = (p) => {
                if (!p) return 'TBD';
                const name = p.athlete?.displayName || 'TBD';
                const stats = p.statistics?.find(s => s.name === 'era')?.displayValue;
                return stats ? `${name} (${stats} ERA)` : name;
            };
            const stadium = comp.venue?.fullName || 'TBD';
            const networks = comp.broadcasts?.[0]?.names?.join(', ') || 'N/A';
            const odds = comp.odds?.[0]?.details || 'TBD';
            const ou = comp.odds?.[0]?.overUnder || 'TBD';

            if (state === 'in' && comp.situation) {
                const situ = comp.situation;
                const batterStats = situ.batter?.summary || '---';
                let pitcherSummary = situ.pitcher?.summary || '---';
                const lastPlayText = situ.lastPlay?.text || '---';

                // Determine who is batting using a robust check
                let isHomeBatting = false;
                if (situ.team && situ.team.id) {
                    isHomeBatting = String(situ.team.id) === String(home.team.id);
                } else {
                    const inningText = status.type.shortDetail || '';
                    isHomeBatting = inningText.toLowerCase().includes('bot') || inningText.toLowerCase().includes('end');
                }

                const leftPlayerLabel = isHomeBatting ? 'Pitching' : 'At Bat';
                const leftPlayerName = isHomeBatting ? (situ.pitcher?.athlete?.displayName || '---') : (situ.batter?.athlete?.displayName || '---');
                const leftTeam = away.team.abbreviation;
                const leftStatsLabel = isHomeBatting ? 'Pitcher Stats' : 'Batter Stats';
                const leftStats = isHomeBatting ? pitcherSummary : batterStats;

                const rightPlayerLabel = isHomeBatting ? 'At Bat' : 'Pitching';
                const rightPlayerName = isHomeBatting ? (situ.batter?.athlete?.displayName || '---') : (situ.pitcher?.athlete?.displayName || '---');
                const rightTeam = home.team.abbreviation;
                const rightStatsLabel = isHomeBatting ? 'Batter Stats' : 'Pitcher Stats';
                const rightStats = isHomeBatting ? batterStats : pitcherSummary;

                html += `
                    <div class="situation-bar">
                        <div>
                            <span class="situ-label">${leftPlayerLabel}</span>
                            <div class="situ-value" style="font-size:1.4rem">
                                ${leftPlayerName} <span style="font-size: 0.9rem; color: var(--text-dim);">(${leftTeam})</span>
                            </div>
                        </div>
                        <div>
                            <span class="situ-label">Network</span>
                            <div class="situ-value" style="font-size:1.4rem">${networks}</div>
                        </div>
                        <div>
                            <span class="situ-label">${rightPlayerLabel}</span>
                            <div class="situ-value" style="font-size:1.4rem">
                                ${rightPlayerName} <span style="font-size: 0.9rem; color: var(--text-dim);">(${rightTeam})</span>
                            </div>
                        </div>
                        
                        <div style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
                            <span class="situ-label">${leftStatsLabel}</span>
                            <div class="situ-value" style="color: var(--warning); font-size:1.3rem">${leftStats}</div>
                        </div>
                        <div style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
                            <span class="situ-label">Stadium</span>
                            <div class="situ-value" style="font-size:1.3rem">${stadium}</div>
                        </div>
                        <div style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
                            <span class="situ-label">${rightStatsLabel}</span>
                            <div class="situ-value" style="color: var(--warning); font-size:1.3rem">${rightStats}</div>
                        </div>

                        <div style="grid-column: span 3; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
                            <span class="situ-label">Last Play</span>
                            <div class="situ-value" style="font-size: 1.2rem; white-space: normal; color: #ccc;">${lastPlayText}</div>
                        </div>
                    </div>
                `;
            } else if (state === 'pre') {
                html += `
                    <div class="situation-bar">
                        <div>
                            <span class="situ-label">${away.team.abbreviation} Starter</span>
                            <div class="situ-value" style="color: var(--warning); font-size:1.4rem">${getStarterDisplay(awayStarter)}</div>
                        </div>
                        <div>
                            <span class="situ-label">Stadium</span>
                            <div class="situ-value" style="font-size:1.4rem">${stadium}</div>
                        </div>
                        <div>
                            <span class="situ-label">${home.team.abbreviation} Starter</span>
                            <div class="situ-value" style="color: var(--warning); font-size:1.4rem">${getStarterDisplay(homeStarter)}</div>
                        </div>
                        
                        <div style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
                            <span class="situ-label">Line</span>
                            <div class="situ-value" style="font-size:1.4rem">${odds}</div>
                        </div>
                        <div style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
                            <span class="situ-label">Network</span>
                            <div class="situ-value" style="font-size:1.4rem">${networks}</div>
                        </div>
                        <div style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
                            <span class="situ-label">O/U</span>
                            <div class="situ-value" style="font-size:1.4rem">${ou}</div>
                        </div>
                    </div>
                `;
            } else if (state === 'post') {
                const winner = comp.notes?.find(n => n.type === 'winner')?.text || '';
                html += `
                    <div class="situation-bar">
                        <div>
                            <span class="situ-label">Stadium</span>
                            <div class="situ-value" style="font-size:1.4rem">${stadium}</div>
                        </div>
                        <div>
                            <span class="situ-label">Game Final</span>
                            <div class="situ-value" style="color: var(--warning); font-size:1.6rem">${winner || 'Game Completed'}</div>
                        </div>
                        <div>
                            <span class="situ-label">Network</span>
                            <div class="situ-value" style="font-size:1.4rem">${networks}</div>
                        </div>
                    </div>
                `;
            }

            html += renderLinescore(away, home, state);
            container.innerHTML = html;
        }

        function renderDiamond(situation) {
            if (!situation) return '';
            return `
                <div class="diamond-container">
                    <div class="base b-2 ${situation.onSecond ? 'occupied' : ''}"></div>
                    <div class="base b-1 ${situation.onFirst ? 'occupied' : ''}"></div>
                    <div class="base b-3 ${situation.onThird ? 'occupied' : ''}"></div>
                </div>
            `;
        }

        function renderOuts(outs) {
            if (outs === undefined) return '';
            return `
                <div class="outs-dots">
                    <div class="dot ${outs >= 1 ? 'active' : ''}"></div>
                    <div class="dot ${outs >= 2 ? 'active' : ''}"></div>
                </div>
            `;
        }

        function renderLinescore(away, home, state) {
            const awayL = away.linescores || [];
            const homeL = home.linescores || [];
            const innings = Math.max(9, awayL.length);
            const isStarted = state !== 'pre';

            let tableHtml = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align:left">TEAM</th>
                                ${Array.from({length: innings}, (_, i) => `<th>${i+1}</th>`).join('')}
                                <th class="total-col">R</th>
                                <th class="total-col">H</th>
                                <th class="total-col">E</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td style="text-align:left">${away.team.abbreviation}</td>
                                ${Array.from({length: innings}, (_, i) => `<td>${awayL[i]?.value ?? ''}</td>`).join('')}
                                <td class="total-col">${isStarted ? away.score : ''}</td>
                                <td class="total-col">${isStarted ? getStat(away, 'hits') : ''}</td>
                                <td class="total-col">${isStarted ? getStat(away, 'errors') : ''}</td>
                            </tr>
                            <tr>
                                <td style="text-align:left">${home.team.abbreviation}</td>
                                ${Array.from({length: innings}, (_, i) => `<td>${homeL[i]?.value ?? ''}</td>`).join('')}
                                <td class="total-col">${isStarted ? home.score : ''}</td>
                                <td class="total-col">${isStarted ? getStat(home, 'hits') : ''}</td>
                                <td class="total-col">${isStarted ? getStat(home, 'errors') : ''}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>`;
            return tableHtml;
        }

        function getStat(team, name) {
            return team.statistics?.find(s => s.name === name)?.displayValue || 0;
        }

        function renderTicker(events) {
            const ticker = document.getElementById('league-ticker');
            const items = events
                .filter(e => e.competitions[0].competitors.every(c => c.team.abbreviation !== MY_TEAM))
                .map(e => {
                    const c = e.competitions[0];
                    const a = c.competitors.find(t => t.homeAway === 'away');
                    const h = c.competitors.find(t => t.homeAway === 'home');
                    return `<span class="ticker-item">${a.team.abbreviation} <span class="ticker-score">${a.score}</span> @ ${h.team.abbreviation} <span class="ticker-score">${h.score}</span> <span style="font-size: 0.7em; color: #666;">(${c.status.type.shortDetail})</span></span>`;
                });
            
            ticker.innerHTML = items.length > 0 ? items.join('') + items.join('') : "No other games in progress.";
        }

        updateDashboard();
        setInterval(updateDashboard, 5000); 
    </script>
</body>
</html>
